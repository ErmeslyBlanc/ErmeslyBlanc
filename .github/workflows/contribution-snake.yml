name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate animated contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ErmeslyBlanc
          outputs: |
            assets/github-snake.svg?color_snake=#9A75FF&color_dots=#131F37,#243E65,#385A91,#5977C5,#9772F5
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#9A75FF&color_dots=#0D1117,#1E3151,#35527B,#526AC7,#A48BFF

      - name: Commit regenerated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution snake graphics"
            git push
          fi
